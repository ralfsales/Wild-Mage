<!doctype html><html lang="en"><meta charset="utf-8"><title>Wild Mage — Creature designs</title><style>body{margin:0;background:#101c18;color:#e4c77d;font-family:Georgia,serif;text-align:center}h1{margin:28px 0 4px;font-weight:normal}p{color:#a8bbab;font:14px Arial}canvas{max-width:100%;height:auto;image-rendering:pixelated}#scaffold{display:none}</style><h1>Creatures of the Wildwood</h1><p>New character art · Elemental silhouettes · The burrowing bush</p><canvas id="gameCanvas" width="960" height="540"></canvas><div id="scaffold"><div id="startScreen"></div><div id="gameOverScreen"></div><div id="finalScore"></div><button id="startButton"></button><button id="restartButton"></button><button id="muteButton"></button><button id="pauseButton"></button><div id="pauseScreen"></div><button id="resumeButton"></button></div><script>window.requestAnimationFrame=()=>0;</script><script src="../game.js"></script><script>
ctx.fillStyle='#101c18';ctx.fillRect(0,0,960,540);
function label(text,x,y,sub){ctx.fillStyle='#e4c77d';ctx.font='21px Georgia';ctx.textAlign='center';ctx.fillText(text,x,y);ctx.fillStyle='#a8bbab';ctx.font='12px Arial';ctx.fillText(sub,x,y+23);ctx.textAlign='start';}
for(const [i,type] of ['mage','fire','water','grass'].entries()){ctx.save();ctx.translate(90+i*230,96);ctx.scale(3,3);if(type==='mage')drawMage(0,0,{x:1,y:0},0,'#e4c77d');else drawCreature(0,0,type,0,false);ctx.restore();}
label('Wild Mage',130,205,'Violet cloak · Crystal staff');label('Ember spirit',360,205,'Living flame · Glowing core');label('Water wisp',590,205,'Droplet body · Rippling feet');label('Bramble bush',820,205,'Leafy canopy · Walking roots');
ctx.strokeStyle='#33483c';ctx.beginPath();ctx.moveTo(55,255);ctx.lineTo(905,255);ctx.stroke();
for(const [i,state] of ['digging','underground','warning'].entries()){ctx.save();ctx.translate(140+i*300,328);ctx.scale(2,2);const m=new Monster(0,0,'grass');m.animationTime=1;m.burrowState=state;if(state==='digging')drawCreature(0,0,'grass',1,true);else{m.trail=[{x:-24,y:8,life:.3},{x:-12,y:4,life:.5}];drawBurrow(m);}ctx.restore();}
label('01 · Dig down',165,452,'The bush sinks into the earth');label('02 · Track the trail',465,452,'Only Grass attacks connect');label('03 · Dodge the ambush',765,452,'Leave the gold ring before eruption');
</script></html>
